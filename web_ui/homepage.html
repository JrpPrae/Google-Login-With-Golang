<html>
<head>
    <title>Homepage</title>
</head>
<body>
    {{if .IsSuccess}}
        <h1>Welcome, {{.Fullname}}!!</h1>
        <p>Your login was successful and data is saved.</p>

        <h1 style="color: red;">{{.ErrorMessage}}</h1>
        <a href="/">Go back to Login</a>
    {{end}}
</body>
</html>
